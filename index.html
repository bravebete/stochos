<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stochos</title>
    <meta name="description" content="Cartes d'inspiration pour composer" />
    <meta name="theme-color" content="#141311" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Stochos" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <style>
      :root {
        --bg: #141311;
        --ink: #ece5d3;
        --muted: #8d877a;
        --card: #efe8d6;
        --card-ink: #161513;
        --card-muted: #5d584d;
        --card-line: #c9c1ab;
        --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 56px 20px 90px;
        font-family: var(--serif);
        color: var(--ink);
        background: var(--bg);
      }

      main {
        max-width: 1100px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 34px;
      }

      h1 {
        margin: 0;
        font-size: clamp(26px, 4vw, 38px);
        font-weight: 400;
        letter-spacing: 0.04em;
      }

      .tagline {
        margin: 10px 0 0;
        font-style: italic;
        color: var(--muted);
      }

      button,
      select {
        font: inherit;
        color: inherit;
      }

      button {
        cursor: pointer;
      }

      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 6px 22px;
        margin-bottom: 26px;
      }

      .draw {
        padding: 13px 34px;
        background: var(--card);
        color: var(--card-ink);
        border: 0;
        border-radius: 3px;
        font-size: 17px;
        letter-spacing: 0.08em;
      }

      .draw:hover {
        background: #fff8e4;
      }

      .link-btn {
        padding: 12px 4px;
        background: none;
        border: 0;
        border-bottom: 1px solid transparent;
        color: var(--muted);
        letter-spacing: 0.04em;
      }

      .link-btn:hover,
      .link-btn[aria-pressed="true"] {
        color: var(--ink);
      }

      .link-btn[aria-pressed="true"] {
        border-bottom-color: var(--ink);
      }

      .views {
        display: flex;
        justify-content: center;
        gap: 2px;
      }

      .icon-btn {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        padding: 0;
        background: none;
        border: 0;
        border-bottom: 1px solid transparent;
        color: var(--muted);
      }

      .icon-btn:hover,
      .icon-btn[aria-pressed="true"] {
        color: var(--ink);
      }

      .icon-btn[aria-pressed="true"] {
        border-bottom-color: var(--ink);
      }

      /* ---------- Cartes ---------- */

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 320px;
        padding: 22px 22px 16px;
        text-align: center;
        color: var(--card-ink);
        background: var(--card);
        border-radius: 3px;
        box-shadow: 0 1px 0 #fff8 inset, 0 10px 24px #0007;
      }

      .card.locked::after {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid var(--card-ink);
        border-radius: 2px;
        pointer-events: none;
      }

      .cat {
        margin: 0 0 18px;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--card-muted);
      }

      .face {
        flex: 1;
      }

      .name {
        margin: 6px 0 12px;
        font-size: clamp(24px, 2.6vw, 30px);
        font-weight: 400;
        line-height: 1.15;
      }

      .desc {
        margin: 0 auto;
        max-width: 28ch;
        font-style: italic;
        line-height: 1.45;
        color: var(--card-muted);
      }

      .desc:empty {
        display: none;
      }

      .card.wide {
        grid-column: 1 / -1;
        min-height: 0;
      }

      .card.wide .name {
        font-size: clamp(22px, 3vw, 32px);
        letter-spacing: 0.03em;
      }

      .card.consigne .name {
        max-width: 26ch;
        margin: 10px auto 14px;
        font-size: clamp(20px, 2.6vw, 28px);
        font-style: italic;
        letter-spacing: 0;
      }

      details {
        margin: 16px 0 6px;
        text-align: left;
        font-size: 14px;
      }

      summary {
        cursor: pointer;
        text-align: center;
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--card-muted);
      }

      dl {
        margin: 12px 0 0;
        padding-top: 10px;
        border-top: 1px solid var(--card-line);
        line-height: 1.4;
      }

      dt {
        margin-top: 8px;
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--card-muted);
      }

      dd {
        margin: 1px 0 0;
      }

      .tools {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid var(--card-line);
        font-size: 13px;
      }

      .tools .spacer {
        flex: 1;
      }

      .tools select {
        flex: 1;
        min-width: 0;
        padding: 6px 0;
        background: none;
        border: 0;
        border-bottom: 1px dotted var(--card-muted);
        color: var(--card-muted);
        font-size: 13px;
      }

      .act {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        background: none;
        border: 0;
        border-radius: 50%;
        color: var(--card-muted);
      }

      .act:hover,
      .act[aria-pressed="true"] {
        color: var(--card-ink);
      }

      .act:hover {
        background: #0000000f;
      }

      .act svg {
        display: block;
      }

      .act .shackle-closed,
      .act[aria-pressed="true"] .shackle-open {
        display: none;
      }

      .act[aria-pressed="true"] .shackle-closed {
        display: inline;
      }

      .act[aria-pressed="true"] rect {
        fill: currentColor;
      }

      .tools :focus-visible,
      .card summary:focus-visible {
        outline-color: var(--card-ink);
      }

      /* ---------- Vue : une carte (tout le tirage sur une seule carte) ---------- */

      .grid.single {
        display: none;
      }

      .summary {
        max-width: 560px;
        margin: 0 auto;
        padding: 28px 30px 20px;
        color: var(--card-ink);
        background: var(--card);
        border-radius: 3px;
        box-shadow: 0 1px 0 #fff8 inset, 0 10px 24px #0007;
      }

      .summary[hidden] {
        display: none;
      }

      .srow:first-child {
        border-top: 0;
      }

      .srow {
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr) auto;
        align-items: baseline;
        gap: 4px 14px;
        padding: 11px 0;
        border-top: 1px solid var(--card-line);
      }

      .srow .label {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--card-muted);
      }

      .srow .pick {
        padding: 0;
        text-align: left;
        background: none;
        border: 0;
        font-size: 21px;
        line-height: 1.25;
        color: var(--card-ink);
      }

      .srow .pick:hover {
        text-decoration: underline;
        text-decoration-style: dotted;
        text-underline-offset: 4px;
      }

      .srow .acts {
        display: flex;
        gap: 2px;
      }

      .summary :focus-visible {
        outline-color: var(--card-ink);
      }

      .sfoot {
        padding: 22px 0 4px;
        text-align: center;
        border-top: 1px solid var(--card-ink);
      }

      .sfoot .pick {
        max-width: 24ch;
        margin: 0 auto;
        padding: 0;
        background: none;
        border: 0;
        font-size: clamp(18px, 3.4vw, 24px);
        font-style: italic;
        line-height: 1.2;
        color: var(--card-ink);
      }

      .sfoot .acts {
        display: flex;
        justify-content: center;
        gap: 14px;
        margin-top: 8px;
        font-size: 13px;
      }

      /* ---------- Vue : liste ---------- */

      .grid.list {
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
      }

      .grid.list .card,
      .grid.list .card.wide {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr) auto;
        align-items: start;
        gap: 16px;
        min-height: 0;
        padding: 14px 20px;
        text-align: left;
      }

      .grid.list .cat {
        margin: 0;
        padding-top: 9px;
      }

      .grid.list .name,
      .grid.list .card.wide .name,
      .grid.list .card.consigne .name {
        margin: 0 0 4px;
        max-width: none;
        font-size: 22px;
        letter-spacing: 0;
      }

      .grid.list .desc {
        max-width: none;
        margin: 0;
      }

      .grid.list details {
        margin: 8px 0 0;
      }

      .grid.list summary {
        text-align: left;
      }

      .grid.list .tools {
        margin: 0;
        padding: 0;
        border: 0;
      }

      .grid.list .tools select {
        display: none;
      }

      .grid.list .tools .spacer {
        display: none;
      }

      /* ---------- Pied de page ---------- */

      .history {
        margin-top: 46px;
        text-align: center;
      }

      .history h3 {
        margin: 0 0 12px;
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .history ol {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .history button {
        padding: 6px;
        background: none;
        border: 0;
        color: var(--muted);
        font-style: italic;
      }

      .history button:hover {
        color: var(--ink);
      }

      .hint {
        margin-top: 22px;
        text-align: center;
        font-size: 13px;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .card.rep {
          grid-column: 1 / -1;
        }
        .grid.list {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      @media (max-width: 580px) {
        body {
          padding: 12px 12px 28px;
        }
        .actions {
          gap: 4px 14px;
          margin-bottom: 12px;
        }
        .draw {
          padding: 10px 22px;
          font-size: 15px;
        }
        .icon-btn {
          width: 38px;
          height: 38px;
        }
        .grid {
          grid-template-columns: minmax(0, 1fr);
          gap: 14px;
        }
        .card {
          min-height: 0;
          padding: 16px 16px 10px;
        }
        .cat {
          margin-bottom: 10px;
          font-size: 10px;
        }
        .name {
          font-size: 22px;
        }
        .desc {
          font-size: 14px;
        }
        details {
          font-size: 13px;
        }
        .card.consigne .name {
          font-size: 18px;
        }

        /* Vue « une carte » : la carte occupe tout l'écran sous la barre du haut. */
        .summary:not([hidden]) {
          display: flex;
          flex-direction: column;
          min-height: calc(100vh - 112px);
          min-height: calc(100dvh - 112px);
          padding: 6px 16px 10px;
        }
        .srow {
          flex: 1;
          grid-template-columns: minmax(0, 1fr) auto;
          align-content: center;
          align-items: center;
          gap: 0 8px;
          padding: 4px 0;
        }
        .srow .label {
          grid-column: 1 / -1;
          font-size: 9.5px;
          letter-spacing: 0.16em;
        }
        .srow .pick {
          font-size: 17px;
        }
        .srow .acts .act {
          width: 32px;
          height: 32px;
        }
        .sfoot {
          flex: 1.7;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding: 10px 0 2px;
        }
        .sfoot .pick {
          font-size: 17px;
        }
        .hint {
          margin-top: 14px;
          font-size: 12px;
        }
        .history {
          margin-top: 28px;
        }
        .grid.list .card,
        .grid.list .card.wide {
          grid-template-columns: minmax(0, 1fr) auto;
        }
        .grid.list .cat {
          grid-column: 1 / -1;
          padding-top: 0;
        }
        .hint .kbd {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header>
      </header>

      <div class="actions">
        <button class="draw" id="drawBtn" type="button">Tirer les cartes</button>

        <div class="views" role="group" aria-label="Vue">
        <button class="icon-btn" type="button" data-view="single" aria-pressed="true" aria-label="Une carte" title="Une carte">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="6" y="3.5" width="12" height="17" rx="1.5" />
            <path d="M9 9h6M9 12h6M9 15h4" />
          </svg>
        </button>
        <button class="icon-btn" type="button" data-view="grid" aria-pressed="false" aria-label="Table" title="Table">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <rect x="4" y="4" width="7" height="7" rx="1" />
            <rect x="13" y="4" width="7" height="7" rx="1" />
            <rect x="4" y="13" width="7" height="7" rx="1" />
            <rect x="13" y="13" width="7" height="7" rx="1" />
          </svg>
        </button>
        <button class="icon-btn" type="button" data-view="list" aria-pressed="false" aria-label="Liste" title="Liste">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        </div>
      </div>

      <section class="summary" id="summary" aria-label="Tirage complet"></section>

      <div class="grid" id="grid"></div>

      

      <section class="history" id="historySection" hidden>
        <h3>Tirages précédents</h3>
        <ol id="history"></ol>
      </section>
    </main>

    <script src="data.js"></script>
    <script>
      // =========================================================
      // CONFIGURATION
      // =========================================================

      const CATS = [
        { id: "atm", label: "Atmosphère", data: atmospheres },
        { id: "tex", label: "Texture", data: textures },
        { id: "col", label: "Couleur", data: colors },
        { id: "gen", label: "Genre / style", data: genres },
        { id: "rhy", label: "Rythme", data: rhythms },
        { id: "mou", label: "Mouvement", data: mouvements },
        { id: "per", label: "Percussions", data: percussions },
        { id: "esp", label: "Espace", data: espaces },
        { id: "str", label: "Structure", data: structures },
        { id: "dur", label: "Durée", data: durees },
      ];

      // Ordre d'affichage. Pour réactiver les consignes : remettre la ligne « con » dans CATS, "con" à la fin de ORDER et le script consignes.js.
      const ORDER = ["atm", "tex", "col", "gen", "rhy", "mou", "per", "esp", "str", "dur", "rep"];

      const FIELD_LABELS = {
        ex: "Exemple",
        tech: "Côté technique",
        progressions: "Progressions typiques (degrés)",
        axe: "Axe",
        mode: "Gamme / mode",
        instrus: "Instruments",
        fx: "Traitement / FX",
        timbre: "Timbre",
        spectre: "Spectre",
        articulation: "Articulation",
        jeu: "Mode de jeu",
        voix: "Technique / voix",
        tessiture: "Tessiture",
        formation: "Formation",
        accords: "Nature des accords",
        bpm: "BPM",
        signature: "Signature rythmique",
        pattern: "Pattern",
        subdivision: "Subdivision",
        accents: "Accents",
        swing: "Swing",
        instruments: "Instruments",
        technique: "Technique",
        traitement: "Traitement / FX",
        plan: "Plan",
        minutes: "Durée indicative",
      };

      const ROOTS = ["Do", "Do♯", "Ré", "Mi♭", "Mi", "Fa", "Fa♯", "Sol", "La♭", "La", "Si♭", "Si"];
      const LETTERS = ["C", "D♭", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
      // Orthographe des notes : lettre du degré + altération (C♯m7 en Si, B♭ en Ré mineur, etc.).
      const LETTER_NAMES = ["C", "D", "E", "F", "G", "A", "B"];
      const NATURAL_PC = [0, 2, 4, 5, 7, 9, 11];
      const ROOT_NAMES = ["C", "C♯", "D", "E♭", "E", "F", "F♯", "G", "A♭", "A", "B♭", "B"];
      const ROOT_LETTER = [0, 0, 1, 2, 2, 3, 3, 4, 5, 5, 6, 6];
      const ROMAN = { I: 1, II: 2, III: 3, IV: 4, V: 5, VI: 6, VII: 7 };
      const DEGREE_OFFSET = { 1: 0, 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11 };
      const MODES = ["majeur", "mineur", "dorien", "phrygien", "lydien", "mixolydien", "locrien"];
      const HISTORY_KEY = "strategies-sonores-history";
      const VIEW_KEY = "strategies-sonores-view";
      const HISTORY_MAX = 8;

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const state = {};
      const locks = new Set();
      const cards = {};
      let repere = { bpm: null, key: "" };
      let histories = [];
      const summaryRows = {};
      const openNext = new Set();
      let view = "single";

      // =========================================================
      // TIRAGE
      // =========================================================

      function rand(n) {
        return Math.floor(Math.random() * n);
      }

      function pickDifferent(arr, currentName) {
        if (arr.length < 2) return arr[0];
        let item;
        do {
          item = arr[rand(arr.length)];
        } while (item.name === currentName);
        return item;
      }

      function findItem(id) {
        const cat = CATS.find((c) => c.id === id);
        return cat.data.find((x) => x.name === state[id]);
      }

      function bpmFromGenre(genre) {
        const range = genre.bpm.match(/(\d+)\s*[–-]\s*(\d+)/);
        if (range) {
          const lo = +range[1];
          const hi = +range[2];
          return lo + rand(hi - lo + 1);
        }
        const single = genre.bpm.match(/(\d+)/);
        return single ? +single[1] : null;
      }

      // Degrés (par rapport à la gamme majeure de la tonique) -> vrais accords.
      // Majuscule = accord majeur, minuscule = mineur, b = degré abaissé d'un demi-ton.
      function chordName(acc, deg, suffix, rootIdx) {
        const lower = deg === deg.toLowerCase();
        let offset = DEGREE_OFFSET[ROMAN[deg.toUpperCase()]];
        if (acc === "b") offset -= 1;
        if (acc === "#") offset += 1;
        const pc = (rootIdx + offset + 12) % 12;
        const letter = (ROOT_LETTER[rootIdx] + ROMAN[deg.toUpperCase()] - 1) % 7;
        let shift = (((pc - NATURAL_PC[letter]) % 12) + 12) % 12;
        if (shift > 6) shift -= 12;
        const note = Math.abs(shift) > 1 ? LETTERS[pc] : LETTER_NAMES[letter] + (shift === 1 ? "♯" : shift === -1 ? "♭" : "");
        if (suffix === "7") return note + (lower ? "m7" : "7");
        if (suffix === "maj7") return note + (lower ? "m(maj7)" : "maj7");
        return note + (lower ? "m" : "");
      }

      function chordify(text, rootIdx) {
        const token = /(^|[^A-Za-zÀ-ÿ])([b#]?)(VII|VI|IV|V|III|II|I|vii|vi|iv|v|iii|ii|i)(maj7|7)?(?![A-Za-zÀ-ÿ0-9])/g;
        return text.replace(token, (m, before, acc, deg, suffix) => before + chordName(acc, deg, suffix || "", rootIdx));
      }

      function rootOfKey(key) {
        const i = ROOTS.findIndex((r) => key.startsWith(r + " "));
        return i < 0 ? null : i;
      }

      function keyFromGenre(genre) {
        const found = MODES.filter((m) => genre.mode.toLowerCase().includes(m));
        if (!found.length) return "libre / modal";
        return `${ROOTS[rand(ROOTS.length)]} ${found[rand(found.length)]}`;
      }

      function drawRepere() {
        const genre = findItem("gen");
        repere = genre ? { bpm: bpmFromGenre(genre), key: keyFromGenre(genre) } : { bpm: null, key: "" };
      }

      function drawAll() {
        const changed = [];
        CATS.forEach((cat) => {
          if (locks.has(cat.id)) return;
          state[cat.id] = pickDifferent(cat.data, state[cat.id]).name;
          changed.push(cat.id);
        });
        if (!locks.has("rep")) {
          drawRepere();
          changed.push("rep");
        }
        deal(ORDER.filter((id) => changed.includes(id)));
        commit();
      }

      function drawOne(id) {
        const cat = CATS.find((c) => c.id === id);
        state[id] = pickDifferent(cat.data, state[id]).name;
        // Vue Table ou Liste : la carte re-tirée s'ouvre (et reste ouverte aux tirages suivants).
        if (view !== "single") openNext.add(id);
        afterChange(id);
      }

      function setOne(id, name) {
        state[id] = name;
        afterChange(id);
      }

      function afterChange(id) {
        const ids = [id];
        if (id === "gen" && !locks.has("rep")) {
          drawRepere();
          ids.push("rep");
        }
        deal(ids);
        commit();
      }

      function rerollRepere() {
        drawRepere();
        deal(["rep"]);
        commit();
      }

      // =========================================================
      // AFFICHAGE
      // =========================================================

      const ICONS = {
        reroll:
          '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<path d="M20 11a8 8 0 0 0-14.3-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.5L20 16M20 20v-4h-4" /></svg>',
        lock:
          '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
          '<rect x="5" y="11" width="14" height="9" rx="2" />' +
          '<path class="shackle-closed" d="M8 11V8a4 4 0 0 1 8 0v3" />' +
          '<path class="shackle-open" d="M8 11V8a4 4 0 0 1 7.4-2.1" /></svg>',
      };

      // Bouton-icône « Retirer » (tirer à nouveau cette carte) ou « Garder » (la conserver au prochain tirage).
      function actionButton(kind, label, id) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "act";
        b.innerHTML = ICONS[kind];
        if (kind === "reroll") {
          b.title = "Retirer cette carte";
          b.setAttribute("aria-label", `Retirer : ${label}`);
          b.addEventListener("click", () => (id === "rep" ? rerollRepere() : drawOne(id)));
        } else {
          b.title = "Garder pour le prochain tirage";
          b.setAttribute("aria-pressed", "false");
          b.setAttribute("aria-label", `Garder : ${label}`);
          b.addEventListener("click", () => toggleLock(id));
        }
        return b;
      }

      function buildCard(id, label, options, cls) {
        const card = document.createElement("article");
        card.className = "card" + (cls ? " " + cls : "");

        const cat = document.createElement("p");
        cat.className = "cat";
        cat.textContent = label;

        const face = document.createElement("div");
        face.className = "face";

        const tools = document.createElement("div");
        tools.className = "tools";

        let select = null;
        if (options) {
          select = document.createElement("select");
          select.setAttribute("aria-label", `Choisir : ${label}`);
          const empty = document.createElement("option");
          empty.value = "";
          empty.textContent = "choisir…";
          select.appendChild(empty);
          options.forEach((item) => {
            const o = document.createElement("option");
            o.value = item.name;
            o.textContent = item.name;
            select.appendChild(o);
          });
          select.addEventListener("change", () => setOne(id, select.value));
          tools.appendChild(select);
        } else {
          const spacer = document.createElement("span");
          spacer.className = "spacer";
          tools.appendChild(spacer);
        }

        const reroll = actionButton("reroll", label, id);
        const lock = actionButton("lock", label, id);

        tools.append(reroll, lock);
        card.append(cat, face, tools);
        cards[id] = { card, face, lock, select, label };
        return card;
      }

      function addField(dl, label, value) {
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        dd.textContent = value;
        dl.append(dt, dd);
      }

      // Champs de détail d'une carte (utilisés dans la vue Table et dans la vue « une carte »).
      function fillDetails(dl, item) {
        Object.keys(item)
          .filter((k) => k !== "name" && k !== "desc")
          .forEach((k) => {
            addField(dl, FIELD_LABELS[k] || k, item[k]);
            if (k === "progressions") {
              const tonic = rootOfKey(repere.key || "");
              const idx = tonic === null ? 0 : tonic;
              const chords = chordify(item[k], idx);
              if (chords !== item[k]) addField(dl, `En accords (tonique ${ROOTS[idx]} = ${ROOT_NAMES[idx]})`, chords);
            }
          });
      }

      function hasDetails(item) {
        return !!item && Object.keys(item).some((k) => k !== "name" && k !== "desc");
      }

      function renderCard(id) {
        const view = cards[id];
        // Une carte dont les détails sont ouverts les garde ouverts quand on la re-tire.
        const previous = view.face.querySelector("details");
        const keepOpen = !!(previous && previous.open) || openNext.has(id);
        openNext.delete(id);
        view.face.replaceChildren();

        const name = document.createElement("h2");
        name.className = "name";
        view.face.append(name);

        if (id === "rep") {
          const parts = [repere.bpm ? `${repere.bpm} BPM` : repere.key ? "tempo libre" : "", repere.key];
          name.textContent = parts.filter(Boolean).join("  ·  ") || "—";
          if (cards.gen && state.gen) renderCard("gen");
          return;
        }

        const item = findItem(id);
        if (!item) {
          name.textContent = "—";
        } else {
          name.textContent = item.name;
          if (hasDetails(item)) {
            const details = document.createElement("details");
            const summary = document.createElement("summary");
            summary.textContent = "détails";
            const dl = document.createElement("dl");
            fillDetails(dl, item);
            details.open = keepOpen;
            details.append(summary, dl);
            view.face.appendChild(details);
          }
        }
        if (view.select) view.select.value = state[id] || "";
      }

      function renderAll() {
        ORDER.forEach(renderCard);
        updateSummary();
      }

      // ---------- Vue « une carte » : tout le tirage sur une seule carte ----------

      function buildSummary() {
        const box = document.getElementById("summary");

        ORDER.forEach((id) => {
          const label = id === "rep" ? "Repères" : cards[id].label;
          const isFoot = id === "con";

          const pick = document.createElement("button");
          pick.type = "button";
          pick.className = "pick";
          pick.title = "Voir le détail";
          pick.addEventListener("click", () => openDetail(id));

          const lock = actionButton("lock", label, id);
          const reroll = actionButton("reroll", label, id);

          const acts = document.createElement("div");
          acts.className = "acts";
          acts.append(reroll, lock);

          const row = document.createElement("div");
          if (isFoot) {
            row.className = "sfoot";
            row.append(pick, acts);
          } else {
            row.className = "srow";
            const l = document.createElement("span");
            l.className = "label";
            l.textContent = label;
            row.append(l, pick, acts);
          }
          box.appendChild(row);
          summaryRows[id] = { row, pick, lock };
        });
      }

      function summaryText(id) {
        if (id === "rep") {
          return [repere.bpm ? `${repere.bpm} BPM` : repere.key ? "tempo libre" : "", repere.key]
            .filter(Boolean)
            .join(" · ") || "—";
        }
        return state[id] || "—";
      }

      function updateSummaryRow(id) {
        summaryRows[id].pick.textContent = summaryText(id);
      }

      function updateSummary() {
        ORDER.forEach(updateSummaryRow);
      }

      // Ouvre la carte correspondante dans la vue Table, avec ses détails.
      function openDetail(id) {
        openNext.add(id);
        setView("grid");
        const card = cards[id].card;
        card.scrollIntoView({ behavior: reducedMotion ? "auto" : "smooth", block: "center" });
        if (!reducedMotion && card.animate) {
          card.animate([{ transform: "scale(1.04)" }, { transform: "scale(1)" }], { duration: 500, easing: "ease-out" });
        }
      }

      // Une seule ligne se retourne (comme une carte) puis affiche son nouveau contenu.
      function flipSummaryRow(id, delay) {
        const row = summaryRows[id].row;
        if (reducedMotion || !row.animate) {
          updateSummaryRow(id);
          return;
        }
        const pose = (deg) => `perspective(800px) rotateX(${deg}deg)`;
        setTimeout(() => {
          const out = row.animate(
            [{ transform: pose(0), opacity: 1 }, { transform: pose(90), opacity: 0.2 }],
            { duration: 150, easing: "ease-in", fill: "forwards" }
          );
          out.onfinish = () => {
            updateSummaryRow(id);
            row.animate(
              [{ transform: pose(-90), opacity: 0.2 }, { transform: pose(0), opacity: 1 }],
              { duration: 220, easing: "ease-out" }
            );
            out.cancel();
          };
        }, delay);
      }

      function flipSummary() {
        const box = document.getElementById("summary");
        if (reducedMotion || !box.animate) {
          renderAll();
          return;
        }
        const pose = (deg) => `perspective(1200px) rotateY(${deg}deg) translateY(${deg ? -8 : 0}px)`;
        const out = box.animate([{ transform: pose(0) }, { transform: pose(90) }], {
          duration: 190,
          easing: "ease-in",
          fill: "forwards",
        });
        out.onfinish = () => {
          renderAll();
          box.animate([{ transform: pose(-90) }, { transform: pose(0) }], { duration: 280, easing: "ease-out" });
          out.cancel();
        };
      }

      // Effet de distribution : la carte se retourne sur sa tranche, change, puis se redresse.
      function flip(id, delay) {
        const card = cards[id].card;
        if (reducedMotion || !card.animate) {
          renderCard(id);
          return;
        }
        const pose = (deg) => `perspective(1000px) rotateY(${deg}deg) translateY(${deg ? -8 : 0}px)`;
        setTimeout(() => {
          const out = card.animate([{ transform: pose(0) }, { transform: pose(90) }], {
            duration: 170,
            easing: "ease-in",
            fill: "forwards",
          });
          out.onfinish = () => {
            renderCard(id);
            card.animate([{ transform: pose(-90) }, { transform: pose(0) }], {
              duration: 240,
              easing: "ease-out",
            });
            out.cancel();
          };
        }, delay);
      }

      function deal(ids) {
        if (view !== "single") {
          ids.forEach((id, i) => flip(id, i * 80));
          return;
        }
        // Vue « une carte » : tirage complet = la carte se retourne, sinon seules les lignes concernées se retournent.
        if (ids.length > 3) {
          flipSummary();
        } else {
          ids.forEach((id, i) => {
            renderCard(id);
            flipSummaryRow(id, i * 80);
          });
        }
      }

      function toggleLock(id) {
        const on = !locks.has(id);
        on ? locks.add(id) : locks.delete(id);
        [cards[id].lock, summaryRows[id].lock].forEach((b) => {
          b.setAttribute("aria-pressed", String(on));
          b.title = on ? "Gardée : sera conservée au prochain tirage" : "Garder pour le prochain tirage";
        });
        cards[id].card.classList.toggle("locked", on);
      }

      // =========================================================
      // VUES
      // =========================================================

      function setView(next) {
        view = next;
        document.getElementById("grid").className = "grid" + (view === "grid" ? "" : " " + view);
        document.getElementById("summary").hidden = view !== "single";
        document.querySelectorAll("[data-view]").forEach((b) =>
          b.setAttribute("aria-pressed", String(b.dataset.view === view))
        );
        renderAll();
        try {
          localStorage.setItem(VIEW_KEY, view);
        } catch (e) {}
      }

      // =========================================================
      // PARTAGE, HISTORIQUE
      // =========================================================

      function toParams() {
        const p = new URLSearchParams();
        CATS.forEach((c) => state[c.id] && p.set(c.id, state[c.id]));
        if (repere.bpm) p.set("bpm", repere.bpm);
        if (repere.key) p.set("key", repere.key);
        return p;
      }

      function fromParams(p) {
        let ok = false;
        CATS.forEach((c) => {
          const v = p.get(c.id);
          const valid = v && c.data.some((x) => x.name === v);
          state[c.id] = valid ? v : undefined;
          if (valid) ok = true;
        });
        repere = { bpm: +p.get("bpm") || null, key: p.get("key") || "" };
        return ok;
      }

      function shortLine(p) {
        return ["atm", "tex", "gen", "rhy"].map((k) => p.get(k) || "—").join(" · ");
      }

      function commit() {
        const qs = toParams().toString();
        try {
          window.history.replaceState(null, "", "#" + qs);
        } catch (e) {}
        if (histories[0] !== qs) {
          histories.unshift(qs);
          histories.length = Math.min(histories.length, HISTORY_MAX + 1);
          try {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(histories));
          } catch (e) {}
          renderHistory();
        }
      }

      function renderHistory() {
        const list = document.getElementById("history");
        list.replaceChildren();
        histories.slice(1).forEach((qs) => {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = shortLine(new URLSearchParams(qs));
          b.addEventListener("click", () => restore(qs));
          li.appendChild(b);
          list.appendChild(li);
        });
        document.getElementById("historySection").hidden = histories.length < 2;
      }

      function restore(qs) {
        fromParams(new URLSearchParams(qs));
        deal(ORDER.filter((id) => !locks.has(id)));
        commit();
      }

      // =========================================================
      // INITIALISATION
      // =========================================================

      if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      }

      document.addEventListener("DOMContentLoaded", () => {
        const grid = document.getElementById("grid");
        ORDER.forEach((id) => {
          if (id === "rep") {
            grid.appendChild(buildCard("rep", "Repères", null, "rep"));
            return;
          }
          const c = CATS.find((x) => x.id === id);
          grid.appendChild(buildCard(id, c.label, c.noSelect ? null : c.data, c.cls));
        });

        try {
          histories = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
        } catch (e) {
          histories = [];
        }

        document.getElementById("drawBtn").addEventListener("click", drawAll);
        document.querySelectorAll("[data-view]").forEach((b) =>
          b.addEventListener("click", () => setView(b.dataset.view))
        );
        document.addEventListener("keydown", (e) => {
          const t = e.target.tagName;
          const typing = t === "BUTTON" || t === "SELECT" || t === "SUMMARY";
          if (e.code === "Space" && !typing) {
            e.preventDefault();
            drawAll();
          }
        });

        buildSummary();

        let saved = "single";
        try {
          saved = localStorage.getItem(VIEW_KEY) || "single";
        } catch (e) {}
        setView(["grid", "single", "list"].includes(saved) ? saved : "single");

        renderHistory();
        if (fromParams(new URLSearchParams(location.hash.slice(1)))) {
          renderAll();
          commit();
        } else {
          drawAll();
        }
      });
    </script>
  </body>
</html>
